<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diana Moon</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0c10;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .card {
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .avatar {
      width: 106px;
      height: 106px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 18px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    .name {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .bio {
      font-size: 0.92rem;
      color: #8f94a0;
      margin-bottom: 32px;
      line-height: 1.4;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px 20px;
      border-radius: 14px;
      font-size: 0.98rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      outline: none;
      transition: transform 0.15s ease, opacity 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .btn-tg {
      background: #229ED9;
      color: #ffffff;
    }

    .btn-vip {
      background: #1a1c23;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .btn span {
      margin-right: 8px;
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300&h=300&fit=crop" alt="Diana Moon" class="avatar">
    
    <h1 class="name">Diana Moon</h1>
    <p class="bio">Exclusive daily updates & backstage</p>

    <div class="links">
      <button type="button" class="btn btn-tg" id="tgBtn">
        <span>💬</span> Private Telegram
      </button>

      <button type="button" class="btn btn-vip" id="vipBtn">
        <span>🔒</span> VIP Exclusive Club
      </button>
    </div>
  </div>

  <script>
    const routes = {
      t: "aHR0cHM6Ly90Lm1lLytHYXgyY0xrN1VkMWxPV0k2",
      v: "aHR0cHM6Ly9mYW5zbHkuY29tL0RpYW5hX01vb24="
    };

    document.getElementById("tgBtn").addEventListener("click", function () {
      const url = atob(routes.t);
      setTimeout(function () {
        window.location.href = url;
      }, 80);
    });

    document.getElementById("vipBtn").addEventListener("click", function () {
      const url = atob(routes.v);
      setTimeout(function () {
        window.location.href = url;
      }, 80);
    });
  </script>

</body>
</html>
